<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../favicon.png" />
<link rel="apple-touch-icon" href="../icon.png" />
<title>心之音 · 专属邀请</title>
<style>
  :root {
    --bg: #0a0a0c; --bg2: #14141a; --bg3: #1d1d25; --line: rgba(255,255,255,0.08);
    --text: #fff; --text2: #a0a0ac; --text3: #626270;
    --accent: #fe2c55; --accent2: #ff6b81; --gold: #f5c66b; --blue: #6b93ff; --green: #0bd07d;
    --grad: linear-gradient(120deg, #fe2c55, #ff6b81);
    --gradB: linear-gradient(120deg, #4c7dff, #8b6bff);
    --gradR: linear-gradient(135deg, #ff6b81 0%, #f5c66b 50%, #fe2c55 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); font-family: "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; }
  img, video { display: block; }

  .demo { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; justify-content: center; gap: 8px; padding: 8px; background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); font-size: 12px; }
  .demo a { padding: 5px 12px; border-radius: 14px; border: 1px solid var(--line); color: var(--text2); }
  .demo a.on { background: #fff; color: #000; border-color: #fff; }
  .demo span { align-self: center; color: var(--text3); }

  .page { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; padding-bottom: 110px; }
  .state { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text2); font-size: 14px; text-align: center; padding: 24px; }
  .state .lg { width: 46px; height: 46px; border-radius: 14px; }
  .state a.btn { margin-top: 10px; }

  .cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent, var(--bg) 30%); }
  .cta .in { max-width: 448px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .cta .txt { flex: 1; min-width: 0; }
  .cta .txt b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cta .txt span { display: block; font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 22px; border-radius: 24px; font-size: 15px; font-weight: 700; color: #fff; background: var(--grad); box-shadow: 0 10px 26px rgba(254,44,85,0.4); white-space: nowrap; }
  .m .btn { background: var(--gradB); box-shadow: 0 10px 26px rgba(76,125,255,0.4); }
  .btn small { display: block; font-size: 10px; font-weight: 400; opacity: .85; line-height: 1; margin-bottom: 3px; }
  .btn span { display: block; line-height: 1.05; }
  .foot { margin: 28px 16px 0; text-align: center; font-size: 11px; color: var(--text3); line-height: 1.8; }
  .foot a { color: var(--text2); }

  /* 顶部大图（两版共用） */
  .fhero { position: relative; height: 68vh; min-height: 470px; max-height: 660px; }
  .fhero .fph { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 28%, #8a2f52, #1a0a12 78%); overflow: hidden; }
  .m .fhero .fph { background: radial-gradient(ellipse at 50% 28%, #2a3f7a, #0a0e1a 78%); }
  .fhero .fph img, .fhero .fph video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fhero .fph.blur img { filter: blur(22px) brightness(.6); transform: scale(1.15); }
  .fhero .fph.blur img.avbig { position: absolute; left: 50%; top: 38%; right: auto; bottom: auto; transform: translate(-50%, -50%); width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.25); filter: none; box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 1; }
  .fhero .fph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,12,0.45) 0%, transparent 25%, transparent 45%, rgba(10,10,12,0.75) 78%, var(--bg) 100%); }
  .ftop { position: absolute; top: 44px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  .brand img { width: 22px; height: 22px; border-radius: 6px; display: block; box-shadow: 0 4px 12px rgba(254,44,85,0.35); }
  .state .lg { width: 56px; height: 56px; border-radius: 16px; }
  .steps .ic { width: 24px; height: 24px; border-radius: 7px; display: inline-block; vertical-align: top; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 5px 10px; border-radius: 12px; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(6px); }
  .live b { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); display: inline-block; }
  .live.off b { background: var(--text3); box-shadow: none; }
  .fhead { position: absolute; left: 20px; right: 20px; bottom: 118px; z-index: 2; }
  .fhead .fname { font-size: 32px; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; text-shadow: 0 2px 12px rgba(0,0,0,0.5); }
  .fhead .fname .vf { font-size: 11px; font-weight: 700; letter-spacing: 0; padding: 3px 8px; border-radius: 8px; background: var(--grad); text-shadow: none; white-space: nowrap; }
  .m .fhead .fname .vf { background: var(--gradB); }
  .fhead .fmeta { margin-top: 6px; font-size: 13px; color: rgba(255,255,255,0.85); display: flex; gap: 6px; flex-wrap: wrap; text-shadow: 0 1px 6px rgba(0,0,0,0.5); }
  .fhead .fmeta span + span::before { content: "·"; margin-right: 6px; color: rgba(255,255,255,0.45); }
  .fhead .fmeta .near { color: var(--gold); }

  /* 名片 */
  .ncard { position: relative; margin: -96px 16px 0; border-radius: 24px; padding: 1.5px; background: var(--gradR); box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04); z-index: 3; }
  .m .ncard { background: linear-gradient(135deg, #6b93ff, #a78bfa 50%, #4c7dff); }
  .ncard::before { content: ""; position: absolute; inset: -1px; border-radius: 25px; background: inherit; filter: blur(18px); opacity: .35; z-index: -1; }
  .ncard .nin { border-radius: 22.5px; background: linear-gradient(170deg, #1c1219 0%, #121216 60%); padding: 18px 18px 0; overflow: hidden; position: relative; }
  .m .ncard .nin { background: linear-gradient(170deg, #12151f 0%, #121216 60%); }
  .ncard .nin::after { content: "心之音"; position: absolute; right: -6px; bottom: 62px; font-size: 64px; font-weight: 900; letter-spacing: 6px; color: rgba(255,255,255,0.025); pointer-events: none; }
  .nrow { display: flex; align-items: center; gap: 12px; }
  .nav-av { width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(160deg, #ff8ba7, #5a1d33); border: 2px solid rgba(255,255,255,0.18); flex-shrink: 0; position: relative; object-fit: cover; }
  .m .nav-av { background: linear-gradient(160deg, #8bb3ff, #1d2a5a); }
  .avwrap { position: relative; flex-shrink: 0; }
  .avwrap.on::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; background: var(--green); border: 2.5px solid #14141a; }
  .ninfo { flex: 1; min-width: 0; }
  .ninfo .ntitle { font-size: 12px; color: var(--text2); letter-spacing: 1px; }
  .ninfo .nid { font-size: 15px; font-weight: 800; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ninfo .nid small { font-size: 11px; color: var(--text3); font-weight: 500; margin-left: 6px; }
  .nbadges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .nbadges:empty { display: none; }
  .nbadges span { font-size: 11px; padding: 4px 9px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: #e6e6ee; display: inline-flex; align-items: center; gap: 5px; }
  .nbadges span::before { content: "✓"; color: var(--green); font-size: 10px; font-weight: 900; }
  .nbadges span.gold { border-color: rgba(245,198,107,0.35); color: var(--gold); background: rgba(245,198,107,0.08); }
  .nbadges span.gold::before { content: "★"; color: var(--gold); }
  .nsay { margin-top: 14px; font-size: 14.5px; line-height: 1.8; color: #eaeaf0; position: relative; padding-left: 14px; word-break: break-word; }
  .nsay::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: var(--gradR); }
  .m .nsay::before { background: var(--gradB); }
  .nprice { margin: 16px -18px 0; display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(0,0,0,0.35); border-top: 1px dashed rgba(255,255,255,0.12); position: relative; }
  .nprice.two { grid-template-columns: 1fr 1fr; }
  .nprice::before, .nprice::after { content: ""; position: absolute; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); }
  .nprice::before { left: -9px; } .nprice::after { right: -9px; }
  .nprice div { text-align: center; padding: 14px 6px 12px; position: relative; }
  .nprice div + div::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 1px; background: var(--line); }
  .nprice b { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
  .nprice small { font-size: 10.5px; color: var(--text2); margin-left: 2px; }
  .nprice span { display: block; font-size: 11.5px; color: var(--text2); margin-top: 3px; }
  .nprice div.hl b { background: var(--gradR); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .m .nprice div.hl b { background: linear-gradient(120deg, #8bb3ff, #c4b5fd); -webkit-background-clip: text; background-clip: text; }
  .nprice div.hl span { color: var(--gold); }
  .m .nprice div.hl span { color: var(--blue); }
  .nfoot { margin: 0 -18px; padding: 8px; text-align: center; font-size: 10.5px; color: var(--text3); background: rgba(0,0,0,0.35); border-top: 1px solid var(--line); }

  .fnum { margin: 14px 16px 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .fnum div { text-align: center; padding: 10px 4px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); }
  .fnum b { display: block; font-size: 15px; font-weight: 800; }
  .fnum span { display: block; font-size: 10px; color: var(--text2); margin-top: 2px; }

  .fsec { margin: 24px 16px 0; display: flex; align-items: baseline; justify-content: space-between; }
  .fsec h3 { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .fsec h3::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--gradR); }
  .m .fsec h3::before { background: var(--gradB); }
  .fsec .more { font-size: 12px; color: var(--text3); }

  .strip { margin-top: 12px; padding: 0 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
  .strip::-webkit-scrollbar { display: none; }
  .strip .it { flex: 0 0 132px; height: 176px; border-radius: 14px; display: block; scroll-snap-align: start; position: relative; overflow: hidden; background: var(--bg3); }
  .strip .it:first-child { flex-basis: 176px; }
  .strip .it img { width: 100%; height: 100%; object-fit: cover; }
  .strip .it.vid::after { content: "▶ 视频"; position: absolute; left: 8px; bottom: 8px; font-size: 10px; padding: 2px 7px; border-radius: 8px; background: rgba(0,0,0,0.55); }

  .feed { margin: 12px 16px 0; display: grid; gap: 8px; }
  .fd { padding: 12px 14px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); display: flex; gap: 12px; }
  .fd .t { flex-shrink: 0; width: 48px; font-size: 11px; color: var(--text3); line-height: 1.5; padding-top: 2px; }
  .fd p { font-size: 13.5px; color: #e6e6ee; line-height: 1.7; flex: 1; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .fd .ph2 { flex-shrink: 0; width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--bg3); }

  .dims { margin: 12px 16px 0; padding: 14px 16px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); display: grid; gap: 10px; }
  .dim { display: grid; grid-template-columns: 70px 1fr 34px; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text2); }
  .dim .t { height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; }
  .dim .t i { display: block; height: 100%; border-radius: 3px; background: var(--gradR); }
  .dim b { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }

  .steps { margin: 12px 16px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .steps div { padding: 14px 10px 12px; border-radius: 14px; background: linear-gradient(170deg, rgba(254,44,85,0.1), var(--bg2) 70%); border: 1px solid rgba(254,44,85,0.2); text-align: center; }
  .m .steps div { background: linear-gradient(170deg, rgba(107,147,255,0.12), var(--bg2) 70%); border-color: rgba(107,147,255,0.25); }
  .steps b { width: 24px; height: 24px; border-radius: 50%; background: var(--grad); color: #fff; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
  .m .steps b { background: var(--gradB); }
  .steps span { display: block; margin-top: 8px; font-size: 12px; color: #e6e6ee; line-height: 1.6; }
  .steps small { display: block; font-size: 10.5px; color: var(--text3); margin-top: 2px; }
  .safe { margin: 14px 16px 0; padding: 10px 14px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); font-size: 11.5px; color: var(--text2); line-height: 1.7; display: flex; gap: 8px; }
  .safe::before { content: "🔒"; }

  /* 男版专用 */
  .earn { margin: 22px 16px 0; padding: 18px; border-radius: 18px; background: linear-gradient(150deg, rgba(245,198,107,0.18), var(--bg2) 65%); border: 1px solid rgba(245,198,107,0.3); }
  .earn h3 { font-size: 16px; font-weight: 800; color: var(--gold); }
  .earn p { margin-top: 6px; font-size: 12.5px; color: var(--text2); line-height: 1.7; }
  .earn .rows { margin-top: 12px; display: grid; gap: 8px; }
  .earn .r { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 9px 12px; border-radius: 10px; background: rgba(0,0,0,0.3); gap: 10px; }
  .earn .r b { color: var(--gold); white-space: nowrap; }
  .earn .sum { margin-top: 10px; text-align: right; font-size: 13px; color: var(--text2); }
  .earn .sum b { font-size: 20px; color: var(--gold); font-weight: 900; margin-left: 6px; }
  .pts { margin: 12px 16px 0; display: grid; gap: 8px; }
  .pt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); }
  .pt .ic { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: rgba(107,147,255,0.14); color: var(--blue); font-size: 15px; }
  .pt b { font-size: 14px; display: block; }
  .pt span { font-size: 12px; color: var(--text2); line-height: 1.6; display: block; margin-top: 2px; }

  /* 微信内打开提示 */
  .wx { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.82); display: none; align-items: flex-start; justify-content: flex-end; padding: 18px 20px; }
  .wx.on { display: flex; }
  .wx div { max-width: 260px; text-align: right; font-size: 15px; line-height: 1.8; }
  .wx div b { display: block; font-size: 30px; line-height: 1; margin-bottom: 8px; }
  .wx div span { display: block; font-size: 12px; color: var(--text2); margin-top: 8px; }

  @media (min-width: 481px) { .page { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="app"><div class="state"><img class="lg" src="../icon.png" alt="" />正在加载…</div></div>
<div class="wx" id="wx" onclick="this.classList.remove('on')"><div><b>↗</b>点右上角「…」<br />选择「在浏览器打开」即可下载<span>微信内无法直接安装 App</span></div></div>

<script>
(function () {
  var API = 'https://api.yyheart.com';
  var q = new URLSearchParams(location.search);
  var code = (q.get('u') || '').trim();
  var demo = !code ? ((q.get('g') || 'f').toLowerCase() === 'm' ? 'm' : 'f') : '';
  var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent), isAnd = /Android/i.test(navigator.userAgent);
  var isWx = /MicroMessenger/i.test(navigator.userAgent);
  var app = document.getElementById('app');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function url(p) { if (!p) return ''; return /^https?:/i.test(p) ? p : API + p; }
  function pts(fen) { var n = Number(fen || 0) / 100; var s = n.toFixed(2).replace(/\.?0+$/, ''); return s === '' ? '0' : s; }
  function ago(t) {
    var d = (Date.now() - new Date(t).getTime()) / 1000;
    if (d < 3600) return Math.max(1, Math.floor(d / 60)) + ' 分钟前';
    if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
    if (d < 86400 * 2) return '昨天';
    if (d < 86400 * 30) return Math.floor(d / 86400) + ' 天前';
    var dt = new Date(t); return (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
  }
  function stars(avg) { return (Math.round(avg / 20 * 10) / 10).toFixed(1); }

  // ---------- 公共片段 ----------
  function hero(d, badge, metaHtml) {
    var first = (d.albums || [])[0];
    var media;
    if (first && first.type === 2 && first.url) {
      media = '<video src="' + esc(url(first.url)) + '" poster="' + esc(url(first.coverUrl || d.avatar)) + '" muted autoplay loop playsinline></video>';
    } else if (first && first.url) {
      media = '<img src="' + esc(url(first.url)) + '" alt="" />';
    } else if (d.avatar) {
      media = '<img src="' + esc(url(d.avatar)) + '" alt="" /><img class="avbig" src="' + esc(url(d.avatar)) + '" alt="" />';
    } else { media = ''; }
    var blur = !(first && first.url) && d.avatar ? ' blur' : '';
    return '<div class="fhero"><div class="fph' + blur + '">' + media + '</div>' +
      '<div class="ftop"><span class="brand"><img src="../icon.png" alt="" />心之音</span><span class="live' + (d.online ? '' : ' off') + '"><b></b>' + (d.online ? '在线' : '最近在线') + (d.cityName ? ' · ' + esc(d.cityName) : '') + '</span></div>' +
      '<div class="fhead"><div class="fname">' + esc(d.nickname) + (badge ? ' <span class="vf">' + badge + '</span>' : '') + '</div><div class="fmeta">' + metaHtml + '</div></div></div>';
  }
  function badges(d, list) {
    return '<div class="nbadges">' + list.filter(Boolean).join('') + '</div>';
  }
  function photos(d) {
    var a = (d.albums || []).filter(function (x) { return x.url; });
    if (!a.length) return '';
    return '<div class="fsec"><h3>' + (d.gender === 2 ? '她' : '他') + '的照片</h3><span class="more">' + a.length + ' 张</span></div><div class="strip">' +
      a.map(function (x) { return '<span class="it' + (x.type === 2 ? ' vid' : '') + '"><img src="' + esc(url(x.type === 2 ? (x.coverUrl || x.url) : x.url)) + '" alt="" /></span>'; }).join('') + '</div>';
  }
  function moments(d) {
    var m = d.moments || [];
    if (!m.length) return '';
    return '<div class="fsec"><h3>' + (d.gender === 2 ? '她' : '他') + '的近况</h3><span class="more">动态广场</span></div><div class="feed">' +
      m.map(function (x) {
        return '<div class="fd"><div class="t">' + esc(ago(x.createdAt)) + '</div><p>' + esc(x.content || (x.type === 2 ? '发布了一条视频' : '发布了一组照片')) + '</p>' + (x.cover ? '<img class="ph2" src="' + esc(url(x.cover)) + '" alt="" />' : '') + '</div>';
      }).join('') + '</div>';
  }
  function foot() {
    return '<p class="foot">一机一号 · 不用手机号注册 · <a href="https://app.yyheart.com/#/agreement/user">用户协议</a> · <a href="https://app.yyheart.com/#/agreement/privacy">隐私政策</a></p>';
  }
  function cta(title, sub, btnText) {
    return '<div class="cta"><div class="in"><div class="txt"><b>' + title + '</b><span>' + sub + '</span></div><a class="btn" href="../#download" id="dl"><small>iOS / Android</small><span>' + btnText + '</span></a></div></div>';
  }

  // ---------- 女版：给男生看 ----------
  function renderF(d) {

    dl.addEventListener('click', function (e) {

        try { fetch(API + '/api/app/invite/click', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code }), keepalive: true }); } catch (_) {}
