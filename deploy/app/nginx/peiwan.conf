# peiwan 统一入口：Web端 / 官网 /site 管理后台 /admin API /api WS /ws 资源 /res
# 安全：按 IP 限流限连（防 CC/DoS），敏感接口更严，隐藏版本号，收紧超时

# 限流区（conf.d 会被 include 进 http 上下文）
limit_req_zone $binary_remote_addr zone=pw_api:10m   rate=20r/s;   # 常规 API
limit_req_zone $binary_remote_addr zone=pw_auth:10m  rate=10r/m;   # 注册/登录/管理员登录
limit_req_zone $binary_remote_addr zone=pw_up:10m    rate=30r/m;   # 上传
limit_req_zone $binary_remote_addr zone=pw_res:10m   rate=40r/s;   # 媒体资源
limit_conn_zone $binary_remote_addr zone=pw_conn:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # 全局默认只允许小包体；仅上传接口单独放大
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # 每 IP 并发连接上限（WS 长连接 + 页面资源足够用）
    limit_conn pw_conn 50;
    limit_conn_status 429;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 入口 index.html 一律不缓存（no-cache = 每次带 ETag 回源校验）：
    # WebView/浏览器缓存旧 index.html 会引用已被新部署删掉的旧 hash 资源 → 页面黑屏、JS 不执行。
    # 带 hash 的 js/css 由文件名变化保证更新，可长缓存。
    location = /index.html {
        root /var/www/peiwan/web;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location ~ ^/(site|admin)/index\.html$ {
        root /var/www/peiwan;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location ~ ^/(site/|admin/)?assets/.+\.(js|css|woff2?|ttf|png|jpe?g|webp|svg)$ {
        root /var/www/peiwan;
        # 用户端在 /var/www/peiwan/web，其余在 /var/www/peiwan/{site,admin}
        try_files $uri /web$uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Web 用户端
    location / {
        root /var/www/peiwan/web;
        try_files $uri $uri/ /index.html;
    }

    # 官网（目录名与 URL 前缀一致，用 root 而非 alias，避免 alias+try_files 拼路径 404）
    location /site/ {
        root /var/www/peiwan;
        try_files $uri $uri/ /site/index.html;
    }

    # 管理后台
    location /admin/ {
        root /var/www/peiwan;
        try_files $uri $uri/ /admin/index.html;
    }

    # 注册/登录：严格限频，防批量注册与撞库
    location /api/auth/ {
        limit_req zone=pw_auth burst=5 nodelay;
        proxy_pass http://peiwan-api:20800/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理员登录：最严
    location = /api/admin/login {
        limit_req zone=pw_auth burst=3 nodelay;
        proxy_pass http://peiwan-api:20800/api/admin/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传：放大包体、限频，防磁盘灌满
    location /api/upload/ {
        limit_req zone=pw_up burst=10 nodelay;
        client_max_body_size 210m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_pass http://peiwan-api:20800/api/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其余后端 API
    location /api/ {
        limit_req zone=pw_api burst=40 nodelay;
        proxy_pass http://peiwan-api:20800/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws {
        proxy_pass http://peiwan-api:20800/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MinIO 对象资源（图片/视频）：只读，文件名为 UUID 不会变更，客户端可长期缓存
    location /res/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=pw_res burst=80 nodelay;
        proxy_pass http://peiwan-minio:9000/;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
