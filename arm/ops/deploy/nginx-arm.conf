# TEMPLATE for /etc/nginx/conf.d/arm.conf — rendered on the server by ops/domains.sh, which replaces
# __SERVER_NAMES__ with every public domain (+ www each). The site is served on SEVERAL domains at once
# (multi-domain redundancy, 9.9): a registrar takedown of one never takes the site offline.
# Add / drop domains with the Windows exe (ops/domains-cli.mjs) or `bash /opt/arm/ops/domains.sh add x.com`;
# one Let's Encrypt certificate named "arm" covers them all. Never edit the rendered file by hand.
# habo.conf is untouched.

upstream arm_web { server 127.0.0.1:3100; }
upstream arm_api { server 127.0.0.1:3101; }

map $http_upgrade $arm_conn {
    default upgrade;
    ''      close;
}

# --- Abuse limits (9.20: a "researcher" flooded us with ~130 junk conn/s from 1,000 IPs for 5 min, exhausted the
# default 768 worker_connections and recorded the resulting slowness as a "vulnerability"). Per-IP budgets, generous
# for real browsers (a token page fires ~10 API calls, a build ships ~40 static chunks): over budget → 429, and
# fail2ban (jail nginx-limit-req / nginx-badreq) bans repeat offenders at the firewall for 10 min.
# Zones live in the http context (conf.d is included there); nginx.conf carries the worker / timeout side.
limit_req_zone  $binary_remote_addr zone=arm_api:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=arm_web:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=arm_conn:10m;
limit_req_status  429;
limit_conn_status 429;
# "error" so the lines reach error.log (its level is error by default) where fail2ban's nginx-limit-req jail reads them
limit_req_log_level  error;
limit_conn_log_level error;

server {
    server_name __SERVER_NAMES__;

    # at most 50 concurrent connections per IP (a browser uses ≤ 6 per host; HTTP/2 uses 1)
    limit_conn arm_conn 50;

    # Indexer REST API (uploads up to 1 MB)
    location /api/ {
        limit_req zone=arm_api burst=60 nodelay;
        client_max_body_size 2m;
        proxy_pass http://arm_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Uniswap Token Lists JSON (9.17): every visible ARK token with logo, importable in Uniswap / wallets.
    location = /tokenlist.json {
        proxy_pass http://arm_api/api/tokenlist.json;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=60" always;
    }

    # Indexer WebSocket
    location = /ws {
        proxy_pass http://arm_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # --- USDC bridge tool (Base -> Arc via Circle CCTP), ops/bridge.html. Unlisted, noindex; the page is static and
    # signs with the visitor's own MetaMask. /iris and /rpc/* are plain pass-throughs so the browser avoids CORS.
    location = /tools/bridge {
        alias /opt/arm/tools/bridge.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /iris/ {
        proxy_pass https://iris-api.circle.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host iris-api.circle.com;
        proxy_read_timeout 30s;
    }
    location = /rpc/base {
        proxy_pass https://mainnet.base.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host mainnet.base.org;
        proxy_read_timeout 30s;
    }
    location = /rpc/arc {
        proxy_pass https://rpc.arc-scan.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host rpc.arc-scan.org;
        proxy_read_timeout 30s;
    }

    # Next build assets are content-hashed: cache forever.
    location ^~ /_next/static/ {
        proxy_pass http://arm_web;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        limit_req zone=arm_web burst=80 nodelay;
        proxy_pass http://arm_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arm_conn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/arm/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/arm/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name __SERVER_NAMES__;
    # any listed host → https on the SAME host (no cross-domain redirect, so a dead domain cannot drag the others down)
    return 301 https://$host$request_uri;
}
